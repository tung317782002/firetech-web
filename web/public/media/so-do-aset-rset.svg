<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif">
  <title>Sơ đồ so sánh ASET và RSET</title>
  <rect width="1280" height="720" fill="#faf8f4"/>
  <g stroke="#ebe6dd" stroke-width="1">
    <path d="M120 140V600M300 140V600M480 140V600M660 140V600M840 140V600M1020 140V600M1200 140V600"/>
  </g>

  <text x="80" y="78" font-size="34" font-weight="800" fill="#11151d">Cuộc chạy đua giữa hai khoảng thời gian</text>
  <text x="80" y="116" font-size="21" fill="#4a5060">Công trình an toàn khi mọi người đã ra ngoài trước lúc điều kiện trở nên nguy hiểm.</text>

  <!-- Mốc bắt đầu cháy -->
  <path d="M120 170V600" stroke="#11151d" stroke-width="3"/>
  <circle cx="120" cy="170" r="9" fill="#e3541c"/>
  <text x="120" y="632" font-size="18" font-weight="700" fill="#11151d" text-anchor="middle">Bắt đầu cháy</text>

  <!-- ASET -->
  <text x="140" y="196" font-size="20" font-weight="800" fill="#b8400f">ASET · thời gian an toàn sẵn có</text>
  <rect x="120" y="210" width="960" height="64" rx="6" fill="#e3541c"/>
  <text x="150" y="250" font-size="19" font-weight="600" fill="#fff">Từ lúc cháy đến khi nhiệt độ, tầm nhìn hoặc khí độc vượt ngưỡng chịu đựng</text>

  <!-- RSET -->
  <text x="140" y="338" font-size="20" font-weight="800" fill="#0e6e55">RSET · thời gian thoát nạn cần thiết</text>
  <g font-size="17" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="120" y="352" width="120" height="64" fill="#0b5c47"/>
    <text x="180" y="390">Phát hiện</text>
    <rect x="240" y="352" width="100" height="64" fill="#0e7a5d"/>
    <text x="290" y="390">Báo động</text>
    <rect x="340" y="352" width="200" height="64" fill="#11906e"/>
    <text x="440" y="390">Chuẩn bị di tản</text>
    <rect x="540" y="352" width="220" height="64" fill="#2fa886"/>
    <text x="650" y="390">Di chuyển</text>
  </g>

  <!-- Biên an toàn -->
  <path d="M760 300V600" stroke="#0e8f6e" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M1080 170V600" stroke="#e3541c" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M772 470H1068" stroke="#11151d" stroke-width="2.5"/>
  <path d="M772 470l14-8v16zM1068 470l-14-8v16z" fill="#11151d"/>
  <rect x="820" y="488" width="200" height="36" rx="18" fill="#11151d"/>
  <text x="920" y="512" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Biên an toàn</text>

  <text x="760" y="632" font-size="18" font-weight="700" fill="#0e6e55" text-anchor="middle">Người cuối cùng ra ngoài</text>
  <text x="1080" y="632" font-size="18" font-weight="700" fill="#b8400f" text-anchor="middle">Điều kiện nguy hiểm</text>

  <rect x="80" y="664" width="1120" height="1" fill="#ddd6ca"/>
  <text x="80" y="696" font-size="19" fill="#11151d"><tspan font-weight="800">Điều kiện đạt:</tspan> ASET lớn hơn RSET kèm hệ số dự phòng, thường lấy bằng 1,5.</text>
</svg>
